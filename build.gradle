// Android + core (+ desktop) build. The ios (RoboVM) and html (GWT) modules use Gradle plugins that
// do not work with Gradle 8, so they are no longer part of the default build; their sources are
// untouched. See settings.gradle.
plugins {
    id 'com.android.application' version '8.13.2' apply false
    id 'com.google.gms.google-services' version '4.5.0' apply false
    id 'com.google.firebase.crashlytics' version '3.0.8' apply false
}

allprojects {
    apply plugin: "eclipse"

    version = '0.8.6'
    ext {
        appName = "1010! Klooni"
        gdxVersion = '1.14.2'
    }
}

project(":desktop") {
    apply plugin: "java-library"

    dependencies {
        implementation project(":core")
        api "com.badlogicgames.gdx:gdx-backend-lwjgl:$gdxVersion"
        api "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    }
}

project(":core") {
    apply plugin: "java-library"
    dependencies {
        api "com.badlogicgames.gdx:gdx:$gdxVersion"
    }
}
